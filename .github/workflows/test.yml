name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # A1111/Forge baseline is 3.10.x; ruff target-version is py310.
          python-version: "3.10"
          cache: pip
      - name: Install test dependencies
        # pytest is not a repo dependency; fastapi/starlette/httpx are required by tests/test_routes.py.
        run: pip install pytest fastapi starlette httpx
      - name: Run pytest
        run: python -m pytest tests/ -v

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run vitest
        run: npm test
      - name: Typecheck app
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Typecheck node
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: Typecheck test
        run: npx tsc --noEmit -p tsconfig.test.json
