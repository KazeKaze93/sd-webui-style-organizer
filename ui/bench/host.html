<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Style Grid Bench Host</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="panel" title="Style Grid panel" src="/"></iframe>
    <script>
      ;(() => {
        const panel = document.getElementById('panel')
        /** @type {{ styles?: unknown[], tab?: string } | undefined} */
        const bench = window.__BENCH__ || {}

        window.__BENCH_HOST__ = {
          readyAt: null,
          initSentAt: null,
          initSentAtMs: null,
          initAcked: false,
        }

        /** Mirror `bridgeOrigin` from javascript/style_grid/post-message.js */
        function bridgeOrigin() {
          return window.location.origin
        }

        /**
         * Mirror `isTrustedIframeEvent` from javascript/style_grid/post-message.js
         * @param {MessageEvent} event
         * @param {HTMLIFrameElement | null} frame
         */
        function isTrustedIframeEvent(event, frame) {
          if (!event || !frame || !frame.contentWindow) return false
          if (event.origin !== bridgeOrigin()) return false
          if (event.source !== frame.contentWindow) return false
          return true
        }

        /**
         * Minimal mirror of `parseFrameMessage` for the only type this host handles.
         * @param {unknown} data
         * @returns {{ type: 'SG_READY' } | null}
         */
        function parseReadyMessage(data) {
          if (!data || typeof data !== 'object' || Array.isArray(data)) return null
          const type = /** @type {{ type?: unknown }} */ (data).type
          if (typeof type !== 'string' || !type.startsWith('SG_')) return null
          if (type !== 'SG_READY') return null
          return { type: 'SG_READY' }
        }

        window.addEventListener('message', (event) => {
          if (!isTrustedIframeEvent(event, panel)) return
          const msg = parseReadyMessage(event.data)
          if (!msg) return
          if (window.__BENCH_HOST__.initSentAt != null) return

          window.__BENCH_HOST__.readyAt = performance.now()
          const styles = Array.isArray(bench.styles) ? bench.styles : []
          const tab = typeof bench.tab === 'string' ? bench.tab : 'txt2img'
          const initMsg = { type: 'SG_INIT', tab, styles }

          window.__BENCH_HOST__.initSentAt = performance.now()
          window.__BENCH_HOST__.initSentAtMs = Date.now()
          if (panel.contentWindow) {
            panel.contentWindow.postMessage(initMsg, bridgeOrigin())
          }
          window.__BENCH_HOST__.initAcked = true
        })
      })()
    </script>
  </body>
</html>
