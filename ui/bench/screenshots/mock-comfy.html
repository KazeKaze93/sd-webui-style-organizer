<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Style Grid screenshots: ComfyUI mock</title>
    <!--
      A stand-in for the ComfyUI canvas, for README screenshots only. The node is
      drawn by hand; the chip row on it is the real web/js/node_chips.js, and the
      panel is the real built iframe. The small host script below answers the
      panel's messages the way web/js/style_grid.js does (apply, unapply,
      wildcards, close), with a neutral demo library.
    -->
    <style>
      :root {
        --comfy-input-bg: #222;
        --input-text: #ddd;
        --border-color: #4e4e4e;
        --p-primary-color: #60a5fa;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background-color: #202020;
        background-image: radial-gradient(#353535 1px, transparent 1px);
        background-size: 22px 22px;
        font: 13px/1.3 Inter, "Segoe UI", Arial, sans-serif;
        color: #ddd;
      }
      .menu {
        position: fixed; inset: 0 0 auto 0; height: 38px; background: #171717;
        border-bottom: 1px solid #2c2c2c; display: flex; align-items: center; gap: 18px;
        padding: 0 14px; color: #aaa; font-size: 13px; z-index: 2;
      }
      .menu b { color: #ddd; font-weight: 600; }
      .menu .run { margin-left: auto; background: #2563eb; color: #fff; padding: 5px 14px; border-radius: 6px; }
      svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .node {
        position: absolute; background: #353535; border: 1px solid #111; border-radius: 8px;
        box-shadow: 0 6px 16px rgba(0,0,0,.45); width: 340px;
      }
      .node.sel { outline: 2px solid #ddd; outline-offset: 1px; }
      .title {
        height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
        border-bottom: 1px solid #1e1e1e; color: #ddd; font-size: 13.5px;
      }
      .title i { width: 8px; height: 8px; border-radius: 50%; background: #888; display: inline-block; }
      .io { display: flex; justify-content: space-between; padding: 6px 10px 2px; color: #bbb; font-size: 12px; }
      .slot { display: flex; align-items: center; gap: 6px; height: 18px; }
      .slot.out { justify-content: flex-end; }
      .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
      .body { padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
      .ta {
        background: var(--comfy-input-bg); border: 1px solid #2a2a2a; border-radius: 6px; color: #ccc;
        font: 12px/1.35 ui-monospace, Consolas, monospace; padding: 6px 8px; min-height: 64px;
        white-space: pre-wrap; word-break: break-word;
      }
      .ta .ph { display: block; color: #777; font-size: 10.5px; margin-bottom: 2px; }
      .num {
        height: 24px; background: #222; border-radius: 12px; display: flex; align-items: center;
        justify-content: space-between; padding: 0 10px; color: #aaa; font-size: 12px;
      }
      .num b { color: #ddd; font-weight: 500; }
      .btn {
        height: 26px; background: #222; border: 1px solid #555; border-radius: 6px; color: #ddd;
        display: grid; place-items: center; font-size: 12px; cursor: pointer;
      }
      #chips:empty { display: none; }
      #sg-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; z-index: 10; }
      #sg-overlay {
        position: fixed; top: 80px; right: 16px; width: 1000px; height: 650px;
        border-radius: 12px; overflow: hidden; display: none; z-index: 11;
        background: #111; box-shadow: 0 25px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05);
      }
      #sg-overlay iframe { width: 100%; height: 100%; border: 0; display: block; }
    </style>
  </head>
  <body>
    <div class="menu"><b>ComfyUI</b><span>Workflow</span><span>Edit</span><span>View</span><span>Help</span><span class="run">Run</span></div>
    <svg class="wires" id="wires"></svg>

    <div class="node" id="ckpt" style="left: 130px; top: 560px; width: 250px">
      <div class="title"><i></i>Load Checkpoint</div>
      <div class="io"><span></span><div>
        <div class="slot out">MODEL <span class="dot" style="background:#b39ddb"></span></div>
        <div class="slot out" id="out-clip">CLIP <span class="dot" style="background:#ffd500"></span></div>
        <div class="slot out">VAE <span class="dot" style="background:#ff6e6e"></span></div>
      </div></div>
      <div class="body"><div class="num">ckpt_name <b>demo_model.safetensors</b></div></div>
    </div>

    <div class="node sel" id="sg" style="left: 60px; top: 70px">
      <div class="title"><i></i>Style Grid</div>
      <div class="io"><span></span><div>
        <div class="slot out" id="out-pos">positive <span class="dot" style="background:#7bd88f"></span></div>
        <div class="slot out" id="out-neg">negative <span class="dot" style="background:#7bd88f"></span></div>
      </div></div>
      <div class="body">
        <div class="ta"><span class="ph">text</span><span id="text"></span></div>
        <div class="ta"><span class="ph">negative_text</span><span id="neg"></span></div>
        <div class="num">seed <b>421337</b></div>
        <div class="num">control after generate <b>randomize</b></div>
        <div id="chips"></div>
        <div class="btn" id="browse">Browse Styles</div>
      </div>
    </div>

    <div class="node" id="enc-pos" style="left: 560px; top: 90px; width: 300px">
      <div class="title"><i></i>CLIP Text Encode (Prompt)</div>
      <div class="io"><div>
        <div class="slot" id="in-clip-pos"><span class="dot" style="background:#ffd500"></span> clip</div>
        <div class="slot" id="in-text-pos"><span class="dot" style="background:#7bd88f"></span> text</div>
      </div><div class="slot out">CONDITIONING <span class="dot" style="background:#ffa931"></span></div></div>
      <div class="body" style="height: 40px"></div>
    </div>

    <div class="node" id="enc-neg" style="left: 560px; top: 250px; width: 300px">
      <div class="title"><i></i>CLIP Text Encode (Prompt)</div>
      <div class="io"><div>
        <div class="slot" id="in-clip-neg"><span class="dot" style="background:#ffd500"></span> clip</div>
        <div class="slot" id="in-text-neg"><span class="dot" style="background:#7bd88f"></span> text</div>
      </div><div class="slot out">CONDITIONING <span class="dot" style="background:#ffa931"></span></div></div>
      <div class="body" style="height: 40px"></div>
    </div>

    <div id="sg-backdrop"></div>
    <!-- Size limits inline, as web/js/style_grid.js sets them: fullscreen clears them. -->
    <div id="sg-overlay" style="max-width: 95vw; max-height: 90vh"><iframe id="panel" title="Style Grid"></iframe></div>

    <script type="module">
      import { createChipRow, nodeChipModel } from '/sg-mock/web-js/node_chips.js'

      const cfg = window.__SG_MOCK__ || { styles: [], applied: [], text: '', negativeText: '' }
      const byKey = new Map(cfg.styles.map((s) => [`${s.source_file}\0${s.name}`, s]))
      const catalogKeys = new Set(byKey.keys())
      /** The node's applied-style ledger, in apply order. */
      const ledger = new Map()
      const textEl = document.getElementById('text')
      const negEl = document.getElementById('neg')
      const panel = document.getElementById('panel')
      const overlay = document.getElementById('sg-overlay')
      const backdrop = document.getElementById('sg-backdrop')

      const tags = (s) => s.split(',').map((t) => t.trim()).filter(Boolean)
      const merge = (base, add) => {
        const out = tags(base)
        for (const t of tags(add)) if (!out.some((x) => x.toLowerCase() === t.toLowerCase())) out.push(t)
        return out.join(', ')
      }
      const strip = (base, remove) => {
        const gone = new Set(tags(remove).map((t) => t.toLowerCase()))
        return tags(base).filter((t) => !gone.has(t.toLowerCase())).join(', ')
      }
      const post = (msg) => panel.contentWindow && panel.contentWindow.postMessage(msg, location.origin)
      const wildcards = () =>
        [...textEl.textContent.matchAll(/\{(sgd?):([^}:]+)(?::([^}]*))?\}/g)].map((m) => ({
          category: m[2], spec: m[3] || '', kind: m[1],
        }))

      function apply(style) {
        textEl.textContent = merge(textEl.textContent, style.prompt)
        negEl.textContent = merge(negEl.textContent, style.negative_prompt)
        ledger.set(`${style.source_file}\0${style.name}`, style)
        render()
      }
      function unapply(sourceFile, name) {
        const style = ledger.get(`${sourceFile}\0${name}`)
        if (!style) return
        textEl.textContent = strip(textEl.textContent, style.prompt)
        negEl.textContent = strip(negEl.textContent, style.negative_prompt)
        ledger.delete(`${sourceFile}\0${name}`)
        render()
      }
      function removeWildcard({ category, spec, kind }) {
        const token = `{${kind}:${category}${spec ? `:${spec}` : ''}}`
        textEl.textContent = strip(textEl.textContent, token)
        render()
        post({ type: 'SG_WILDCARDS_ACTIVE', categories: wildcards() })
      }

      const row = createChipRow({
        doc: document,
        onOpen: () => openPanel(),
        onRemoveStyle: ({ source_file, name }) => unapply(source_file, name),
        onRemoveWildcard: removeWildcard,
      })
      document.getElementById('chips').appendChild(row.el)

      function render() {
        row.render(
          nodeChipModel({
            ledgerEntries: [...ledger.values()],
            text: textEl.textContent,
            negativeText: negEl.textContent,
            catalogKeys,
          }),
        )
        drawWires()
      }

      function center(id, side) {
        const r = document.getElementById(id).querySelector('.dot').getBoundingClientRect()
        return { x: side === 'out' ? r.right - 4 : r.left + 4, y: r.top + r.height / 2 }
      }
      function drawWires() {
        const svg = document.getElementById('wires')
        const wire = (from, to, color) => {
          const a = center(from, 'out')
          const b = center(to, 'in')
          const dx = Math.max(60, (b.x - a.x) / 2)
          return `<path d="M${a.x} ${a.y} C ${a.x + dx} ${a.y}, ${b.x - dx} ${b.y}, ${b.x} ${b.y}" stroke="${color}" stroke-width="3" fill="none" opacity="0.9"/>`
        }
        svg.innerHTML =
          wire('out-pos', 'in-text-pos', '#7bd88f') +
          wire('out-neg', 'in-text-neg', '#7bd88f') +
          wire('out-clip', 'in-clip-pos', '#ffd500') +
          wire('out-clip', 'in-clip-neg', '#ffd500')
      }

      function openPanel() {
        if (!panel.getAttribute('src')) panel.src = '/?theme=dark'
        backdrop.style.display = 'block'
        overlay.style.display = 'block'
        panel.focus()
      }
      function closePanel() {
        backdrop.style.display = 'none'
        overlay.style.display = 'none'
      }
      document.getElementById('browse').addEventListener('click', openPanel)
      backdrop.addEventListener('click', closePanel)

      window.addEventListener('message', (e) => {
        if (e.source !== panel.contentWindow || e.origin !== location.origin) return
        const msg = e.data || {}
        if (msg.type === 'SG_READY') {
          post({ type: 'SG_INIT', styles: cfg.styles })
          post({ type: 'SG_THEME', mode: 'dark' })
          post({ type: 'SG_CLEAR_SELECTION' })
          for (const style of ledger.values()) post({ type: 'SG_STYLE_APPLIED', style })
          post({ type: 'SG_WILDCARDS_ACTIVE', categories: wildcards() })
          post({ type: 'SG_DECK_STATE', seed: 52113, index: 3 })
        } else if (msg.type === 'SG_APPLY') {
          const style = byKey.get(`${msg.source_file}\0${msg.styleId}`) || {
            name: msg.styleId, prompt: msg.prompt, negative_prompt: msg.neg, source_file: msg.source_file || '',
          }
          apply(style)
        } else if (msg.type === 'SG_UNAPPLY') {
          unapply(msg.source_file || '', msg.styleId)
        } else if (msg.type === 'SG_WILDCARD_CATEGORY' || msg.type === 'SG_WILDCARD_SLICE') {
          const token = `{${msg.kind || 'sg'}:${msg.category}${msg.spec ? `:${msg.spec}` : ''}}`
          textEl.textContent = merge(textEl.textContent, token)
          render()
          post({ type: 'SG_WILDCARDS_ACTIVE', categories: wildcards() })
        } else if (msg.type === 'SG_CLOSE_REQUEST') {
          closePanel()
        }
      })

      textEl.textContent = cfg.text || ''
      negEl.textContent = cfg.negativeText || ''
      for (const key of cfg.applied || []) {
        const style = byKey.get(key)
        if (style) apply(style)
      }
      render()
      window.__SG_MOCK_READY__ = true
      if (cfg.openPanel) openPanel()
    </script>
  </body>
</html>
